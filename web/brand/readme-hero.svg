<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Bursar: the AI reads, the contract decides, a dumb executor moves the money">
  <!-- The README banner. Three roles, one gate, animated with SMIL so it moves inside an <img> on GitHub. Brand: obsidian, white, one signal green. -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1d2320"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#00ec97" stop-opacity="0"/><stop offset=".5" stop-color="#00ec97" stop-opacity=".9"/><stop offset="1" stop-color="#00ec97" stop-opacity="0"/></linearGradient>
    <clipPath id="doc"><rect x="372" y="104" width="76" height="96" rx="4"/></clipPath>
    <style>
      .h { font-family: "Space Grotesk", "Helvetica Neue", Arial, sans-serif; font-weight: 700; fill: #fff; letter-spacing: 3px; }
      .m { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; fill: #9a9e9a; }
      .g { fill: #00ec97; }
    </style>
  </defs>
  <rect width="1200" height="320" fill="#0d0f0e"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- mark and wordmark -->
  <g transform="translate(48 60)">
    <rect width="64" height="64" rx="4" fill="#000"/>
    <rect x="14" y="16" width="36" height="8" fill="#fff"/>
    <rect x="14" y="28" width="24" height="8" fill="#00ec97"><animate attributeName="width" values="24;36;24" dur="3.6s" repeatCount="indefinite"/></rect>
    <rect x="14" y="40" width="36" height="8" fill="#fff"/>
    <text x="84" y="44" class="h" font-size="30" letter-spacing="5">BURSAR</text>
    <text x="86" y="70" class="m" font-size="12">AI treasurer on NEAR</text>
  </g>
  <text x="48" y="178" class="m" font-size="13">The AI reads.</text>
  <text x="48" y="200" class="m" font-size="13">The contract decides.</text>
  <text x="48" y="222" class="m" font-size="13">A dumb executor moves the money.</text>
  <text x="48" y="266" class="m" font-size="11" fill="#5c625e">non custodial · USDC · every reading attested · every decision on chain</text>

  <!-- stage 1: the AI reads, inside an enclave -->
  <g>
    <rect x="330" y="72" width="200" height="176" rx="6" fill="#161918" stroke="#262a28"/>
    <text x="430" y="60" text-anchor="middle" class="h" font-size="13">THE AI READS</text>
    <rect x="372" y="104" width="76" height="96" rx="4" fill="#0d0f0e" stroke="#3a403c"/>
    <g fill="#5c625e">
      <rect x="384" y="118" width="40" height="4"/><rect x="384" y="130" width="52" height="4"/><rect x="384" y="142" width="46" height="4"/><rect x="384" y="154" width="30" height="4"/>
      <rect x="384" y="176" width="52" height="6" fill="#fff"/>
    </g>
    <g clip-path="url(#doc)">
      <rect x="372" y="104" width="76" height="3" fill="url(#fade)"><animate attributeName="y" values="104;197;104" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="372" y="104" width="76" height="96" fill="#00ec97" opacity="0"><animate attributeName="opacity" values="0;0;.08;0" keyTimes="0;.45;.5;1" dur="2.4s" repeatCount="indefinite"/></rect>
    </g>
    <text x="468" y="128" class="m" font-size="11">TEE</text>
    <text x="468" y="146" class="m" font-size="11">NEAR AI</text>
    <text x="468" y="164" class="m" font-size="11">Cloud</text>
    <text x="430" y="232" text-anchor="middle" class="m" font-size="11">signed receipt, attested</text>
  </g>

  <!-- stage 2: the contract decides -->
  <g>
    <rect x="600" y="72" width="200" height="176" rx="6" fill="#161918" stroke="#00ec97"/>
    <text x="700" y="60" text-anchor="middle" class="h" font-size="13" fill="#00ec97">THE CONTRACT DECIDES</text>
    <g class="m" font-size="11">
      <text x="624" y="108">allowlisted vendor</text>
      <text x="624" y="128">registered payout</text>
      <text x="624" y="148">caps, budgets, orders</text>
      <text x="624" y="168">no duplicates</text>
      <text x="624" y="188">threshold: a person</text>
    </g>
    <g>
      <rect x="766" y="100" width="18" height="10" rx="2" fill="#00ec97"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="766" y="120" width="18" height="10" rx="2" fill="#00ec97"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" begin=".2s" repeatCount="indefinite"/></rect>
      <rect x="766" y="140" width="18" height="10" rx="2" fill="#00ec97"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" begin=".4s" repeatCount="indefinite"/></rect>
      <rect x="766" y="160" width="18" height="10" rx="2" fill="#00ec97"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" begin=".6s" repeatCount="indefinite"/></rect>
      <rect x="766" y="180" width="18" height="10" rx="2" fill="#ffc266"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" begin=".8s" repeatCount="indefinite"/></rect>
    </g>
    <text x="700" y="232" text-anchor="middle" class="m" font-size="11">limits the AI cannot change</text>
  </g>

  <!-- stage 3: the executor moves the money -->
  <g>
    <rect x="870" y="72" width="200" height="176" rx="6" fill="#161918" stroke="#262a28"/>
    <text x="970" y="60" text-anchor="middle" class="h" font-size="13">MOVES THE MONEY</text>
    <circle cx="930" cy="150" r="30" fill="#0d0f0e" stroke="#3a403c"/>
    <text x="930" y="156" text-anchor="middle" class="h" font-size="15" letter-spacing="1">USDC</text>
    <g class="m" font-size="11">
      <text x="976" y="128">NEAR</text>
      <text x="976" y="146">Base, Arbitrum</text>
      <text x="976" y="164">Solana, Sui</text>
      <text x="976" y="182">via Intents</text>
    </g>
    <text x="970" y="232" text-anchor="middle" class="m" font-size="11">only the payout the owner recorded</text>
  </g>

  <!-- connectors with travelling pulses -->
  <path id="c1" d="M530 160 H600" stroke="#262a28" stroke-width="2"/>
  <path id="c2" d="M800 160 H870" stroke="#262a28" stroke-width="2"/>
  <circle r="4" fill="#fff"><animateMotion dur="2.4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1"><mpath href="#c1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle r="4" fill="#00ec97"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1"><mpath href="#c2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>

  <!-- ticker: what the gate says, in turn -->
  <g font-size="12" class="m" text-anchor="middle">
    <text x="700" y="290" fill="#00ec97" opacity="0">Paid: AH-0923, 480.00 USDC, vendor on NEAR, same transaction<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.3;.35;1" dur="9.6s" repeatCount="indefinite"/></text>
    <text x="700" y="290" fill="#ff6b6b" opacity="0">Blocked: payout on the invoice differs from the vendor record (the new bank details fraud)<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.35;.4;.63;.68;1" dur="9.6s" repeatCount="indefinite"/></text>
    <text x="700" y="290" fill="#ffc266" opacity="0">Held: 9,800.00 USDC at the threshold, waiting for the DAO council<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.68;.73;.96;1" dur="9.6s" repeatCount="indefinite"/></text>
  </g>
</svg>
