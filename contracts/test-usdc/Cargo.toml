[package]
name = "test-usdc"
version = "0.1.0"
edition = "2021"
description = "A throwaway NEP-141 token for Bursar testnet demos. Anyone can mint."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
near-contract-standards = "5"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
