[package]
name = "bursar-registry"
version = "0.1.0"
edition = "2021"
description = "Bursar registry: the list of treasuries the explorer and the sign-in page read. Entries are hints; readers verify the owner against the treasury contract."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
strip = true
lto = true
debug = false
panic = "abort"
overflow-checks = true
