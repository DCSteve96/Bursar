[package]
name = "bursar-policy"
version = "0.1.0"
edition = "2021"
description = "Bursar policy contract: an AI treasurer that pays invoices within limits it cannot change"
repository = "https://github.com/TBD/bursar"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
schemars = "0.8"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
strip = true
lto = true
debug = false
panic = "abort"
overflow-checks = true
